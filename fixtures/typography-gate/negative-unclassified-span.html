<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; }
    .poster { box-sizing: border-box; width: 1080px; height: 1440px; padding: 96px; background: #f4f2ed; color: #14252a; }
    h1 { margin: 0 0 48px; font-size: 72px; line-height: 1.18; }
    span { font-size: 40px; line-height: 1.5; }
  </style>
</head>
<body>
  <section class="poster">
    <h1 data-font-role="primary_headline">标题已标注角色</h1>
    <div><span>这个可见 span 没有角色，也不能安全继承语义角色。</span></div>
  </section>
</body>
</html>

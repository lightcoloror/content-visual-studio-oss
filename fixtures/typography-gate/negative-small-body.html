<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; }
    .poster { box-sizing: border-box; width: 1080px; height: 1440px; padding: 96px; background: #f4f2ed; color: #14252a; }
    h1 { margin: 0 0 48px; font-size: 72px; line-height: 1.18; }
    p { margin: 0; font-size: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <section class="poster">
    <h1 data-font-role="primary_headline">这是一条可读的大标题</h1>
    <p data-font-role="body">这段合成正文故意低于字号门槛。</p>
  </section>
</body>
</html>

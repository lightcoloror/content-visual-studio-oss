<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic Check Fixture A - Toy Blocks</title>
</head>
<body>
  <!-- SYNTHETIC CHECK FIXTURE: Parser-input example for semantic visual validation tests -->
  <main>
    <section data-semantic-id="block-sort-color">
      <h2>Step 1: Color Sorting</h2>
      <p>Sort blocks into red, blue, and yellow trays to begin organization.</p>
      <img src="assets/toy-blocks-color.svg" alt="Toy blocks sorted by color">
    </section>

    <section data-semantic-id="block-match-shape">
      <h2>Step 2: Shape Matching</h2>
      <p>Align square and round blocks with tray cutouts for stable placement.</p>
      <img src="assets/toy-blocks-shape.svg" alt="Toy blocks matched to cutouts">
    </section>

    <section data-semantic-id="block-stack-tower">
      <h2>Step 3: Tower Stacking</h2>
      <p>Stack blocks carefully to build a stable tower without tipping.</p>
      <img src="assets/toy-blocks-stack.svg" alt="Toy blocks stacked vertically">
    </section>
  </main>
</body>
</html>
